<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <!-- pinch-zoom is disabled at the page level so it doesn't fight the
         app's own zoom (double-tap, +/- pill, ctrl+wheel) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PDF Reader</title>
    <!-- docx-preview's UMD build reads the global JSZip, so JSZip loads first -->
    <script src="/vendor/docx-preview/jszip.min.js"></script>
    <script src="/vendor/docx-preview/docx-preview.min.js"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="toolbar">
      <button id="sidebar-toggle-btn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <button id="open-btn" class="icon-btn" title="Open a PDF or Word file" aria-label="Open a PDF or Word file">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
          <path d="M14 3v6h6" />
          <path d="M12 12v6M9 15h6" />
        </svg>
      </button>
      <button id="page-mode-btn" class="icon-btn" title="Toggle page layout" aria-label="Toggle between single and double page view" hidden>
        <svg class="layout-icon layout-icon-vertical" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="2.5" width="14" height="8" rx="1.5" />
          <rect x="5" y="13.5" width="14" height="8" rx="1.5" />
        </svg>
        <svg class="layout-icon layout-icon-side-by-side" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4" width="8" height="16" rx="1.5" />
          <rect x="13.5" y="4" width="8" height="16" rx="1.5" />
        </svg>
      </button>
      <button id="zoom-out-btn" class="icon-btn" title="Zoom out" aria-label="Zoom out" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M8 11h6" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </button>
      <button id="zoom-in-btn" class="icon-btn" title="Zoom in" aria-label="Zoom in" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M8 11h6M11 8v6" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </button>
      <button id="zoom-reset-btn" class="icon-btn" title="Fit to screen (reset zoom)" aria-label="Fit to screen and reset zoom" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V5a1 1 0 0 1 1-1h4" />
          <path d="M20 9V5a1 1 0 0 0-1-1h-4" />
          <path d="M4 15v4a1 1 0 0 0 1 1h4" />
          <path d="M20 15v4a1 1 0 0 1-1 1h-4" />
        </svg>
      </button>
      <span id="app-title">PDF Reader</span>
      <div id="toolbar-menu-wrap">
        <button id="toolbar-menu-btn" class="icon-btn" title="View options" aria-label="View options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="1.7" />
            <circle cx="12" cy="12" r="1.7" />
            <circle cx="12" cy="19" r="1.7" />
          </svg>
        </button>
        <div id="toolbar-menu" role="menu" aria-label="View options" hidden>
          <div class="toolbar-menu-heading">Page layout</div>
          <button class="layout-menu-option" data-page-layout="single" role="menuitemradio" aria-checked="true" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="5" y="2.5" width="14" height="8" rx="1.5" />
              <rect x="5" y="13.5" width="14" height="8" rx="1.5" />
            </svg>
            <span><strong>Vertical scroll</strong><small>Swipe freely through one page per row</small></span>
            <span class="layout-option-check" aria-hidden="true">&#10003;</span>
          </button>
          <button class="layout-menu-option" data-page-layout="dual" role="menuitemradio" aria-checked="false" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="2.5" y="4" width="8" height="16" rx="1.5" />
              <rect x="13.5" y="4" width="8" height="16" rx="1.5" />
            </svg>
            <span><strong>Side by side</strong><small>Show pages next to each other</small></span>
            <span class="layout-option-check" aria-hidden="true">&#10003;</span>
          </button>
        </div>
      </div>
      <span id="status"></span>
      <div id="loading-indicator" hidden>
        <div class="spinner"></div>
        <span>Loading document...</span>
      </div>
    </div>
    <div id="app-shell">
      <div id="sidebar-backdrop"></div>
      <aside id="sidebar">
        <div class="sidebar-section">
          <h3 class="sidebar-heading">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5" />
              <path d="M9 3h6l1 6 3 3v2H5v-2l3-3z" />
            </svg>
            Pinned
          </h3>
          <div id="sidebar-pinned"></div>
        </div>
        <div class="sidebar-section">
          <h3 class="sidebar-heading">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 3" />
            </svg>
            Recent
          </h3>
          <div id="sidebar-recent"></div>
        </div>
      </aside>
      <div id="main-area">
        <div id="empty-state">
          <div id="empty-state-icon">
            <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <path d="M12 6h16l8 8v28a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" />
              <path d="M28 6v8h8" />
              <path d="M16 26h16M16 32h11" stroke-width="1.5" />
            </svg>
          </div>
          <p id="empty-state-text">Drop a PDF or Word file here or click to open</p>
        </div>
        <div id="viewer-container" hidden><div id="pdf-pages"></div></div>
        <div id="docx-container" hidden><div id="docx-pages"></div></div>
      </div>
    </div>
  </body>
</html>
